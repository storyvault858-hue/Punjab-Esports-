name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build web assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Setup Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or higher is required. Found Java $JAVA_MAJOR."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-disabled: false

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ] && [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore created at: $KEYSTORE_PATH"
          else
            echo "Debug keystore already exists."
          fi
          if [ ! -f "$KEYSTORE_PATH" ] && [ ! -f "debug.keystore" ]; then
            echo "ERROR: Failed to create temporary debug keystore."
            exit 1
          fi

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Looking for generated APKs inside android/app/build/outputs/apk..."
            FOUND_APKS=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || true)
            echo "Discovered APKs:"
            echo "$FOUND_APKS"
            echo "ERROR: Expected debug APK not found at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK file exists but is empty (0 bytes)."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || wc -c < "$APK_PATH")
          echo "Verified Debug APK:"
          echo "  Path: $APK_PATH"
          echo "  Size: $APK_SIZE bytes"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="punjab-esports"
          fi

          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_DIR=$(mktemp -d)
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "android/app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is invalid."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Punjab Esports - Automated Debug APK

          - **Build Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** \`${{ github.sha }}\`
          - **APK Asset:** \`${{ steps.prepare_asset.outputs.asset_filename }}\`
          - **Signing:** Temporary Debug Keystore

          > **Note:** This APK is generated automatically by GitHub Actions for testing and device installation. It is not an official Play Store release.

          **Download APK:** You can directly download the \`.apk\` file below under the **Assets** section.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### 📱 Punjab Esports Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"

            echo "✅ **Debug APK successfully published to GitHub Releases!**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download:** Go to the release page and download \`$ASSET_NAME\` under the Assets section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup:** The APK is also preserved in this workflow run as artifact \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"

            echo "Release publish succeeded: $RELEASE_URL"
          else
            echo "⚠️ **APK was built successfully, but GitHub Release creation encountered an error.**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Available:** You can still download the APK from the **Artifacts** section of this workflow run: \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Reason:** Check the 'Publish APK to GitHub Releases' step logs above (e.g. repository release permissions or token scope)." >> "$GITHUB_STEP_SUMMARY"

            echo "WARNING: Release creation failed, but artifact app-debug-apk remains available."
          fi
