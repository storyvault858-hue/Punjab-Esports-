name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build web assets
        run: |
          echo "Installing npm dependencies..."
          npm install --force --no-audit --no-fund
          echo "Building web assets with Vite..."
          npm run build
          echo "Syncing Capacitor Android..."
          npx @capacitor/cli sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android"
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_HOME" ] && [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          echo "Running Gradle assembleDebug..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          echo "Locating generated APK..."
          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            FOUND_APK="$EXPECTED_APK"
          else
            FOUND_APK=$(find android -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
            if [ -z "$FOUND_APK" ]; then
              FOUND_APK=$(find android -type f -name "*.apk" 2>/dev/null | head -n 1)
            fi
          fi

          if [ -z "$FOUND_APK" ] || [ ! -s "$FOUND_APK" ]; then
            echo "ERROR: Debug APK was not found or is empty."
            find android -maxdepth 5 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "Found verified Debug APK at: $FOUND_APK"
          mkdir -p android/app/build/outputs/apk/debug
          if [ "$FOUND_APK" != "$EXPECTED_APK" ]; then
            cp "$FOUND_APK" "$EXPECTED_APK"
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified Debug APK Size: $APK_SIZE bytes"
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="punjab-esports"
          fi

          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_DIR=$(mktemp -d)
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "android/app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Punjab Esports Debug APK Build #${{ github.run_number }}"

          NOTES="### Punjab Esports Debug APK (Build #${{ github.run_number }})
          Download \`${{ steps.prepare_asset.outputs.asset_filename }}\` directly from the Assets section below."

          echo "Publishing release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          echo "### 📱 Punjab Esports Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify_apk.outcome }}" = "success" ]; then
            RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "✅ **Debug APK successfully generated!**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download:** You can download the APK from the [Releases Page]($RELEASE_URL) or under the **Artifacts** tab on this page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Build encountered an error before APK verification.** Check step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
